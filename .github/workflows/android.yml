name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.gitmodules'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository and pinned Android core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and install NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android API, build tools, and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Test EVDroid number, emoji, camel-case, regex, and punctuation processing
        run: |
          mkdir -p build/text-processing-test
          javac -encoding UTF-8 -d build/text-processing-test \
            android/java/org/reloq/tts/EmojiNames.java \
            android/java/org/reloq/tts/EmojiProcessing.java \
            android/java/org/reloq/tts/NumberProcessing.java \
            android/java/org/reloq/tts/PunctSymbols.java \
            android/java/org/reloq/tts/PunctuationProcessing.java \
            android/java/org/reloq/tts/CamelCase.java \
            android/java/org/reloq/tts/RegexDictionaries.java \
            android/java/org/reloq/tts/TextPipeline.java \
            android/test/TextProcessingTest.java
          java -cp build/text-processing-test org.reloq.tts.TextProcessingTest

      - name: Build and verify signed APK
        run: |
          python3 android/build.py \
            --sdk "$ANDROID_HOME" \
            --ndk "$ANDROID_HOME/ndk/30.0.16248370" \
            --java-home "$JAVA_HOME" \
            --verified-dictionaries \
            --jobs 2 \
            --output dist/reloq-c-android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apple-eloquence-android-arm64
          path: dist/reloq-c-android-arm64.apk
          compression-level: 0
          retention-days: 14
