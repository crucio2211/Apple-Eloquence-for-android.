# Android APK build for apple-eloquence-elf (fork-friendly)
#
# Builds the experimental Android TTS engine APK on GitHub Actions:
#   1. fetch the proven engine .so files into android jniLibs
#   2. build libsoxr with the NDK (high-quality upsampler)
#   3. build APK with Gradle (no wrapper in repo, so we install Gradle 8.9)
# The APK is signed with the stable test key in elo-debug.keystore
# (test key only — never use for real releases), so updates install cleanly.
#
# Trigger:
#   - manual workflow_dispatch (gamitin mo ito sa fork mo)
#   - push sa main/master na humihipo sa android/, macho2elf/, vendor/, o sa file na ito

name: Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'macho2elf/**'
      - 'vendor/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
      ANDROID_API: 34
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK + install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "platform-tools"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          ls -la "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -20

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget ninja-build curl cmake

      - name: Fetch proven engine libs
        # Known-good converted Apple tvOS libs (verified speaking on real
        # devices). The JNI bridge itself (libeloquence_jni.so) is still
        # built from source by Gradle below.
        run: |
          OUT=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$OUT"
          BASE=https://raw.githubusercontent.com/GGbond2007/eloquence-tts-android/main/native-libs/arm64-v8a
          for n in eci enu eng esp esm fra frc deu ita ptb fin chs cht jpn kor \
                   chsrom chtrom jpnrom korrom; do
            curl -fsSL -o "$OUT/lib${n}.so" "$BASE/lib${n}.so"
            echo "fetched lib${n}.so"
          done
          curl -fsSL -o "$OUT/libc++_shared.so" "$BASE/libc++_shared.so"
          echo "fetched libc++_shared.so"

      - name: Build libsoxr (NDK, for high-quality upsampling)
        # libsoxr renders the 11025 Hz engine output at 48000 Hz when the
        # "higher sampling rate" checkbox is on. Built from source with
        # the NDK toolchain; staged next to the engine libs.
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          git clone --depth 1 --branch 0.1.3 https://github.com/chirlu/soxr.git soxr
          cmake -S soxr -B soxr-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DWITH_OPENMP=OFF
          cmake --build soxr-build -j"$(nproc)"
          find soxr-build -name 'libsoxr.so*'
          cp "$(find soxr-build -name 'libsoxr.so.0*' | head -1)" \
            android/app/src/main/jniLibs/arm64-v8a/libsoxr.so
          echo "SOXR_INC=$PWD/soxr/src" >> "$GITHUB_ENV"
          echo "--- staged jniLibs ---"
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Install stable test key
        run: |
          mkdir -p ~/.android
          cp elo-debug.keystore ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Install Gradle 8.9
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.9/bin/gradle --version

      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          gradle assembleDebug --stacktrace --info
          echo "--- outputs ---"
          find app/build/outputs -type f | head -20
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eloquence-tts-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
