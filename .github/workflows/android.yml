name: Android APK

on:
  push:
    branches: [main, release/v1.2.3]
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.gitmodules'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.gitmodules'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}-text-processing
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Check out repository and pinned Android core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and install NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android API, build tools, and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;30.0.16248370'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Resolve Android app version and release APK name
        id: version
        run: |
          VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("android/AndroidManifest.xml").getroot()
          key = "{http://schemas.android.com/apk/res/android}versionName"
          version = root.get(key, "")
          if not version or not all(part.isdigit() for part in version.split(".")) or len(version.split(".")) != 3:
              raise SystemExit("Android versionName must be MAJOR.MINOR.PATCH")
          print(version)
          PY
          )
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag v$VERSION is required to match Android versionName $VERSION"
              exit 1
            fi
          fi
          APK_NAME="apple-eloquence-android-arm64-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Test Android update metadata and version ordering
        run: |
          mkdir -p build/update-test
          javac -encoding UTF-8 -d build/update-test \
            android/java/org/reloq/tts/UpdateData.java \
            android/test/UpdateDataTest.java
          java -cp build/update-test org.reloq.tts.UpdateDataTest
          python3 android/test_versioning.py

      - name: Test Android update scheduling and Direct Boot
        run: |
          python3 android/test_auto_updates.py --java-home "$JAVA_HOME"
          python3 android/test_direct_boot.py --java-home "$JAVA_HOME"
          python3 android/test_settings.py \
            --java-home "$JAVA_HOME" \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
            --settings-only
          python3 android/test_translations.py

      - name: Test EVDroid number, emoji, camel-case, regex, and punctuation processing
        run: |
          mkdir -p build/text-processing-test
          javac -encoding UTF-8 -d build/text-processing-test \
            android/java/org/reloq/tts/EmojiNames.java \
            android/java/org/reloq/tts/EmojiProcessing.java \
            android/java/org/reloq/tts/NumberProcessing.java \
            android/java/org/reloq/tts/PunctSymbols.java \
            android/java/org/reloq/tts/PunctuationProcessing.java \
            android/java/org/reloq/tts/CamelCase.java \
            android/java/org/reloq/tts/RegexDictionaries.java \
            android/java/org/reloq/tts/TextPipeline.java \
            android/test/TextProcessingTest.java
          java -cp build/text-processing-test org.reloq.tts.TextProcessingTest

      - name: Build and verify signed APK
        run: |
          python3 android/build.py \
            --sdk "$ANDROID_HOME" \
            --ndk "$ANDROID_HOME/ndk/30.0.16248370" \
            --java-home "$JAVA_HOME" \
            --verified-dictionaries \
            --jobs 2 \
            --output "dist/${{ steps.version.outputs.apk_name }}"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-eloquence-android-arm64
          path: dist/${{ steps.version.outputs.apk_name }}
          compression-level: 0
          retention-days: 14

      - name: Publish latest main build to the rolling GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-main
          APK_PATH: dist/${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          TITLE="Apple Eloquence Android — Latest main build"
          NOTES="Latest successful Android ARM64 build from the main branch. This is a testing prerelease and is excluded from the in-app stable update checker. Source commit: $GITHUB_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes "$NOTES" --prerelease
          fi
          gh release upload "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish stable Android APK to the matching GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/v1.2.3'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.3' }}
          APK_PATH: dist/${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Apple Eloquence $RELEASE_TAG" \
              --notes "Stable Android ARM64 release. Download the APK and follow Android's normal installation flow."
          fi
          gh release upload "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --clobber
