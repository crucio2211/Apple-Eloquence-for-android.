# Bionic lab (manual only): run the converted engine under a REAL Bionic
# linker64 on an ARM runner — no device needed. Compares fresh Mudb0y
# conversion output vs the proven blobs across old/new Bionic userlands.
#
#   job1 (x86): convert eci+enu + compile harness + download ARM system images
#   job2 (arm): matrix api x libset -> dlopen/eciNewEx/synthesize report
name: Bionic-Lab

on:
  workflow_dispatch:

jobs:
  build-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK + converter deps
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm python3-venv
          if ! command -v llvm-lipo >/dev/null; then
            LIPO=$(ls /usr/bin/llvm-lipo-* 2>/dev/null | sort -V | tail -1)
            sudo ln -sf "$LIPO" /usr/local/bin/llvm-lipo
          fi
          python3 -m venv conv-venv
          ./conv-venv/bin/pip install --upgrade pip -q
          ./conv-venv/bin/pip install -q "lief==0.17.6"

      - name: Convert eci + enu (pinned pipeline)
        run: |
          git clone --depth 1 https://github.com/Mudb0y/Apple-Eloquence-ELF.git upstream-elf
          NDK=/usr/local/lib/android/sdk/ndk/27.2.12479018
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          mkdir -p conv-slices lab-libs conv-work
          for base in eci enu; do
            llvm-lipo -extract arm64 "upstream-elf/vendor/tvOS-18.2/${base}.dylib" \
              -output "conv-slices/${base}.arm64.dylib"
            ./conv-venv/bin/python3 upstream-elf/macho2elf/macho2elf.py \
              "conv-slices/${base}.arm64.dylib" \
              --os android --cc "$CLANG" \
              -o "lab-libs/lib${base}.so" --workdir "conv-work/${base}_work"
          done
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" lab-libs/
          "$CLANG" tools/bionic-lab/harness.c -o lab-libs/harness -ldl
          ls -la lab-libs/

      - name: Download ARM system images (API 28 + 35)
        # The emulator package only exists for x86_64 hosts, so the
        # image dependency resolves here (it cannot on ARM runners).
        # The images themselves are arm64 userlands for the ARM test job.
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "system-images;android-28;google_apis;arm64-v8a" \
            "system-images;android-30;google_apis;arm64-v8a" \
            "system-images;android-33;google_apis;arm64-v8a"
          ls -la /usr/local/lib/android/sdk/system-images/android-28/google_apis/arm64-v8a/
          ls -la /usr/local/lib/android/sdk/system-images/android-30/google_apis/arm64-v8a/
          ls -la /usr/local/lib/android/sdk/system-images/android-33/google_apis/arm64-v8a/

      - name: Upload lab inputs
        uses: actions/upload-artifact@v4
        with:
          name: lab-input
          path: lab-libs/
          retention-days: 3

      - name: Upload sysimg-28
        uses: actions/upload-artifact@v4
        with:
          name: sysimg-28
          path: /usr/local/lib/android/sdk/system-images/android-28/google_apis/arm64-v8a/system.img
          retention-days: 1

      - name: Upload sysimg-30
        uses: actions/upload-artifact@v4
        with:
          name: sysimg-30
          path: /usr/local/lib/android/sdk/system-images/android-30/google_apis/arm64-v8a/system.img
          retention-days: 1

      - name: Upload sysimg-33
        uses: actions/upload-artifact@v4
        with:
          name: sysimg-33
          path: /usr/local/lib/android/sdk/system-images/android-33/google_apis/arm64-v8a/system.img
          retention-days: 1

  test:
    needs: [build-inputs]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30, 33]
        libset: [fresh, proven]
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip kpartx e2fsprogs

      - name: Download inputs
        uses: actions/download-artifact@v4
        with:
          name: lab-input
          path: lab-input/

      - name: Download system image
        uses: actions/download-artifact@v4
        with:
          name: sysimg-${{ matrix.api }}
          path: sysimg/

      - name: Extract linker + Bionic libs (kpartx + mount + search)
        run: |
          mkdir -p sysroot mnt
          IMG=$(find sysimg -name 'system.img' | head -1)
          echo "image: $IMG"
          ls -la "$IMG"
          # Map every partition, mount each ext4 one, and hunt for the
          # Bionic userland (bin/linker64 + lib64/{libc,libm,libdl}.so).
          sudo kpartx -av "$IMG"
          sleep 2
          ls /dev/mapper/ || true
          FOUND=""
          for dev in /dev/mapper/loop*p*; do
            [ -b "$dev" ] || continue
            echo "--- trying $dev ---"
            if sudo mount -o ro "$dev" mnt 2>/dev/null; then
              if [ -f mnt/bin/linker64 ] && [ -f mnt/lib64/libc.so ]; then
                echo "FOUND userland on $dev"
                FOUND="$dev"
                sudo cp mnt/bin/linker64 sysroot/
                sudo cp mnt/lib64/libc.so mnt/lib64/libm.so mnt/lib64/libdl.so sysroot/
                sudo umount mnt
                break
              fi
              echo "not a system fs; contents:"
              ls mnt/ | head -20 || true
              sudo umount mnt
            else
              echo "mount failed for $dev"
            fi
          done
          sudo kpartx -dv "$IMG" || true
          chmod +x sysroot/linker64
          ls -la sysroot/
          test -f sysroot/linker64 -a -f sysroot/libc.so -a -f sysroot/libm.so -a -f sysroot/libdl.so

      - name: Stage test libs
        run: |
          mkdir -p case/libs case/sys
          cp sysroot/linker64 sysroot/libc.so sysroot/libm.so sysroot/libdl.so case/sys/
          if [ "${{ matrix.libset }}" = "fresh" ]; then
            cp lab-input/libeci.so lab-input/libenu.so lab-input/libc++_shared.so case/libs/
          else
            BASE=https://raw.githubusercontent.com/GGbond2007/eloquence-tts-android/main/native-libs/arm64-v8a
            curl -fsSL -o case/libs/libeci.so "$BASE/libeci.so"
            curl -fsSL -o case/libs/libenu.so "$BASE/libenu.so"
            curl -fsSL -o case/libs/libc++_shared.so "$BASE/libc++_shared.so"
          fi
          cp lab-input/harness case/
          chmod +x case/sys/linker64 case/harness
          cat > case/eci.ini <<EOF
          [1.0]
          Path=$PWD/case/libs/libenu.so
          Version=6.1

          Voice1=0 50 65 30 0 0 50 92
          Voice9=0 50 69 0 0 0 50 92
          EOF
          ls -la case/ case/libs/ case/sys/

      - name: Run harness under Bionic linker64
        run: |
          cd case
          echo "=== api=${{ matrix.api }} libset=${{ matrix.libset }} ==="
          timeout 120 ./sys/linker64 --library-path sys:libs \
            ./harness "$PWD/libs/libeci.so" "$PWD/eci.ini" 10000; echo "EXIT=$?"
