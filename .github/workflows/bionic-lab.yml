# Bionic lab (manual only): run the converted engine under a REAL Bionic
# linker64 on an ARM runner — no device needed. Compares fresh Mudb0y
# conversion output vs the proven blobs across old/new Bionic userlands.
#
#   job1 (x86):   convert eci+enu with the pinned pipeline + compile harness
#   job2 (arm):   fetch Bionic userlands (API 28 + 35 system images)
#   job3 (arm):   matrix api x libset -> dlopen/eciNewEx/synthesize report
name: Bionic-Lab

on:
  workflow_dispatch:

jobs:
  build-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK + converter deps
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm python3-venv
          if ! command -v llvm-lipo >/dev/null; then
            LIPO=$(ls /usr/bin/llvm-lipo-* 2>/dev/null | sort -V | tail -1)
            sudo ln -sf "$LIPO" /usr/local/bin/llvm-lipo
          fi
          python3 -m venv conv-venv
          ./conv-venv/bin/pip install --upgrade pip -q
          ./conv-venv/bin/pip install -q "lief==0.17.6"

      - name: Convert eci + enu (pinned pipeline)
        run: |
          git clone --depth 1 https://github.com/Mudb0y/Apple-Eloquence-ELF.git upstream-elf
          NDK=/usr/local/lib/android/sdk/ndk/27.2.12479018
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          mkdir -p conv-slices lab-libs conv-work
          for base in eci enu; do
            llvm-lipo -extract arm64 "upstream-elf/vendor/tvOS-18.2/${base}.dylib" \
              -output "conv-slices/${base}.arm64.dylib"
            ./conv-venv/bin/python3 upstream-elf/macho2elf/macho2elf.py \
              "conv-slices/${base}.arm64.dylib" \
              --os android --cc "$CLANG" \
              -o "lab-libs/lib${base}.so" --workdir "conv-work/${base}_work"
          done
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" lab-libs/
          "$CLANG" tools/bionic-lab/harness.c -o lab-libs/harness -ldl
          ls -la lab-libs/

      - name: Upload lab inputs
        uses: actions/upload-artifact@v4
        with:
          name: lab-input
          path: lab-libs/
          retention-days: 3

  fetch-sys:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        api: [28, 35]
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip curl python3 android-sdk-libsparse-utils e2fsprogs

      - name: Resolve + download system image
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, os
          api = "${{ matrix.api }}"
          want = f"system-images;android-{api};google_apis;arm64-v8a"
          print("fetching repository xml...", flush=True)
          data = urllib.request.urlopen(
              "https://dl.google.com/android/repository/repository2-1.xml").read()
          print(f"xml bytes: {len(data)}", flush=True)
          root = ET.fromstring(data)
          found = False
          for pkg in root.iter():
              if not pkg.tag.endswith("remotePackage"):
                  continue
              if pkg.get("path") != want:
                  continue
              for arch in pkg.iter():
                  if not arch.tag.endswith("archive"):
                      continue
                  url = size = None
                  for c in arch.iter():
                      if c.tag.endswith("url") and url is None:
                          url = (c.text or "").strip()
                      if c.tag.endswith("size") and size is None:
                          size = (c.text or "").strip()
                  if url:
                      print(f"URL={url}", flush=True)
                      print(f"SIZE={size}", flush=True)
                      open(os.environ["GITHUB_ENV"], "a").write(f"SYSURL={url}\nSYSSIZE={size}\n")
                      found = True
          if not found:
              print("no sys-img url found", flush=True)
          PY
          test -n "$SYSURL" || { echo "no sys-img url found"; exit 1; }
          curl -fSL -o sysimg.zip "$SYSURL"
          ls -la sysimg.zip
          unzip -o sysimg.zip -d sysimg/

      - name: Extract linker + Bionic libs
        run: |
          mkdir -p sysroot
          IMG=$(find sysimg -name 'system.img' | head -1)
          echo "image: $IMG"
          simg2img "$IMG" system.raw || cp "$IMG" system.raw
          for f in "bin/linker64|linker64" "lib64/libc.so|libc.so" \
                   "lib64/libm.so|libm.so" "lib64/libdl.so|libdl.so"; do
            src="${f%%|*}"; dst="${f##*|}";
            debugfs -R "dump $src sysroot/$dst" system.raw 2>&1 || \
            debugfs -R "dump system/$src sysroot/$dst" system.raw
          done
          chmod +x sysroot/linker64
          ls -la sysroot/

      - name: Upload sysroot
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-${{ matrix.api }}
          path: sysroot/
          retention-days: 3

  test:
    needs: [build-inputs, fetch-sys]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
        libset: [fresh, proven]
    steps:
      - name: Download inputs
        uses: actions/download-artifact@v4
        with:
          name: lab-input
          path: lab-input/

      - name: Download sysroot
        uses: actions/download-artifact@v4
        with:
          name: sysroot-${{ matrix.api }}
          path: case/sys/

      - name: Stage test libs
        run: |
          mkdir -p case/libs
          if [ "${{ matrix.libset }}" = "fresh" ]; then
            cp lab-input/libeci.so lab-input/libenu.so lab-input/libc++_shared.so case/libs/
          else
            BASE=https://raw.githubusercontent.com/GGbond2007/eloquence-tts-android/main/native-libs/arm64-v8a
            curl -fsSL -o case/libs/libeci.so "$BASE/libeci.so"
            curl -fsSL -o case/libs/libenu.so "$BASE/libenu.so"
            curl -fsSL -o case/libs/libc++_shared.so "$BASE/libc++_shared.so"
          fi
          cp lab-input/harness case/
          chmod +x case/sys/linker64 case/harness
          cat > case/eci.ini <<EOF
          [1.0]
          Path=$PWD/case/libs/libenu.so
          Version=6.1

          Voice1=0 50 65 30 0 0 50 92
          Voice9=0 50 69 0 0 0 50 92
          EOF
          ls -la case/ case/libs/ case/sys/

      - name: Run harness under Bionic linker64
        run: |
          cd case
          echo "=== api=${{ matrix.api }} libset=${{ matrix.libset }} ==="
          timeout 120 ./sys/linker64 --library-path sys:libs \
            ./harness "$PWD/libs/libeci.so" "$PWD/eci.ini" 10000; echo "EXIT=$?"
